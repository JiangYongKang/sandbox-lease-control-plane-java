# 临时环境租约控制平面（全部为进程内配置，不依赖任何外部服务）
spring.application.name=sandbox-lease-control-plane

# 资源池容量：最多可同时持有的沙箱租约数
lease.pool-capacity=4
# 默认 TTL（秒）：申请时 ttlSeconds 为 0 时使用
lease.default-ttl-seconds=60
# 单次租约/续约允许的最大 TTL（秒）
lease.max-ttl-seconds=3600
# 自动回收扫描间隔（毫秒）
lease.reaper-interval-millis=2000

# 静态团队额度（可选）：lease.team-quotas.<teamId>=上限
# 未配置的团队不额外受限，仅受整池容量约束；也可通过 PUT /api/leases/teams/{teamId}/quota 在线调整
#lease.team-quotas.team-a=2
#lease.team-quotas.team-b=1
